name: build-and-push

# Build the web-app image and push it to the Harbor project `law-bench`.
#
# Harbor is served over plain HTTP (insecure), so before login/build/push the
# workflow registers the host in the docker daemon's insecure-registries (for
# `docker login`) and in a buildkit config (for the buildx push).
#
# Required repository SECRETS (Settings -> Secrets and variables -> Actions):
#   LAW_BENCH_HARBOR_REGISTRY  Harbor host, e.g. http://harbor.finddatatech.cloud:8080
#                              (the cheap-cluster Harbor; a leading http(s):// and
#                              a trailing / are stripped)
#   LAW_BENCH_HARBOR_USER      Harbor robot username, e.g. robot$law-bench+law-bench
#   LAW_BENCH_HARBOR_PASS      Harbor robot password / token
#
# Optional repository VARIABLE:
#   LAW_BENCH_HARBOR_PROJECT   Harbor project name (default: law-bench)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Harbor registry + image name
        id: img
        run: |
          set -euo pipefail
          reg="${{ secrets.LAW_BENCH_HARBOR_REGISTRY }}"
          reg="${reg#https://}"
          reg="${reg#http://}"
          reg="${reg%/}"
          if [ -z "$reg" ]; then
            echo "::error::Secret LAW_BENCH_HARBOR_REGISTRY is empty. Set it to your Harbor host (e.g. http://harbor.finddatatech.cloud:8080)." >&2
            exit 1
          fi
          project="${{ vars.LAW_BENCH_HARBOR_PROJECT || 'law-bench' }}"
          echo "registry=${reg}" >> "$GITHUB_OUTPUT"
          echo "name=${reg}/${project}/law-template" >> "$GITHUB_OUTPUT"

      - name: Allow insecure (HTTP) Harbor registry in docker daemon
        run: |
          set -euo pipefail
          reg="${{ steps.img.outputs.registry }}"
          cfg=/etc/docker/daemon.json
          if [ -f "$cfg" ] && jq empty "$cfg" 2>/dev/null; then
            tmp="$(mktemp)"
            jq --arg r "$reg" '. + {"insecure-registries": (((.insecure-registries // []) + [$r]) | unique)}' "$cfg" > "$tmp"
            sudo mv "$tmp" "$cfg"
          else
            echo "{\"insecure-registries\":[\"${reg}\"]}" | sudo tee "$cfg" >/dev/null
          fi
          sudo systemctl restart docker
          sleep 3
          echo "insecure-registries: $(docker info --format '{{json .RegistryConfig.InsecureRegistryCIDRs}}')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."${{ steps.img.outputs.registry }}"]
              http = true
              insecure = true

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.img.outputs.registry }}
          username: ${{ secrets.LAW_BENCH_HARBOR_USER }}
          password: ${{ secrets.LAW_BENCH_HARBOR_PASS }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed to Harbor"
            echo ""
            echo '```'
            echo "image: ${{ steps.img.outputs.name }}"
            echo "tags:  ${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
