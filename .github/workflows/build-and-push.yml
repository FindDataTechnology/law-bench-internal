name: build-and-push

# Build the web-app image on GitHub-hosted runners and push it to Tencent
# TCR personal edition. The cluster-side deployment pulls from TCR (k8s
# secret `tcr-pull`, ns `law-bench`); rollout stays Gitee-driven — ArgoCD
# watches the Gitee repo because the cheap-cluster nodes cannot reach
# github.com. A deploy is: push code here (this build runs), then bump the
# image tag in `deploy/*.yaml` and push to Gitee.
#
# No China-mirror build args here on purpose: hosted runners are outside
# China, so the Dockerfile defaults (ghcr.io base, pypi.org, deb.debian.org,
# npmjs) apply. The Jenkins path keeps the mirror args for in-cluster builds
# (dual-track fallback).
#
# Required repository SECRETS (Settings -> Secrets and variables -> Actions):
#   TCR_USER   TCR personal edition login user (Tencent account id)
#   TCR_PASS   TCR personal edition login password (console-set)
#
# First push of a commit is slow (~2.3 GB across the Pacific); the GHA layer
# cache shrinks subsequent builds.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ccr.ccs.tencentyun.com/law-bench/law-template

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to TCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USER }}
          password: ${{ secrets.TCR_PASS }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed to TCR"
            echo ""
            echo '```'
            echo "image: ${{ env.IMAGE }}"
            echo "tags:  ${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
