# Container image publish — GitHub Actions → Tencent TCR personal edition.
# Standard channel per openspec tcr-image-pipeline (2026-09-30 user directive):
# push to hkccr (HK, fast transpacific leg) → cheap-3 tcr-relay backfills
# ccr.ccs.tencentyun.com (≤5 min cycle, skopeo byte-identical) → nodes pull
# from ccr (registries.yaml auth, no imagePullSecret needed).
# Jenkins→Harbor remains the fallback channel for this repo.
#
# Matrix on push: law-template (web app + bundled MCP) + law-render
# (extract-render-service: shared DOCX->PDF render pod).
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: law-bench

jobs:
  # 测试先跑：合同模板/槽位审计/条款装配/评测规则是核心不变量，测试不过不应出片。
  # 套件是 hermetic 的，只要求一个可达 PostgreSQL（conftest 为每个用例建库）。
  # 需要真实 MinIO 的两个集成用例带 @pytest.mark.external，这里显式排除并打印清单。
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: law_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Public-repo leak gate (fail-closed)
        run: python3 scripts/check_public_hygiene.py

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # fd-coding-law-bench-mcp 的 server.py 在 tests/test_tool_annotations.py
          # 导入链上（MCP 工具注解对账），fastmcp 是其声明依赖。
          pip install "fastmcp>=3.2,<4"
          pip install pytest

      - name: Test suite (external excluded)
        env:
          database_url: postgresql://app:app@localhost:5432/law_bench
          # 让 MinIO 探活立刻失败而不是等网络超时：本 job 不跑 external 用例，
          # 但 import 期构造的默认端点不能指向真实地址。
          minio_host: http://127.0.0.1:1
        run: |
          echo "== 被排除的 external 用例 =="
          python -m pytest tests -q -m external --collect-only || true
          echo "== 正式跑 =="
          python -m pytest tests -q -m "not external"

  build-push:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: law-template
            dockerfile: Dockerfile
          - image: law-render
            dockerfile: Dockerfile.render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
