# Container image publish — GitHub Actions → Tencent TCR personal edition.
# Standard channel per openspec tcr-image-pipeline (2026-09-30 user directive):
# push to hkccr (HK, fast transpacific leg) → cheap-3 tcr-relay backfills
# ccr.ccs.tencentyun.com (≤5 min cycle, skopeo byte-identical) → nodes pull
# from ccr (registries.yaml auth, no imagePullSecret needed).
# Jenkins→Harbor remains the fallback channel for this repo.
#
# Matrix on push: law-template (web app + bundled MCP) + law-render
# (extract-render-service: shared DOCX->PDF render pod).
#
# **本仓是这两个镜像名的唯一写者（2026-11-22）。**
#
# 公开导出面 `FindDataTechnology/law-bench` 也有一个同内容的 image.yml，两仓都推
# `law-bench/law-template` 与 `law-bench/law-render` —— 谁最后跑谁定义 `:main`。
# 那个仓已归档，但归档挡 push、不挡 workflow_dispatch，所以它的 workflow 仍是
# 一个可触发的第二写者。该文件已删除。
#
# 因此：本仓的 image.yml 不能被导出到公开面。导出白名单若整目录带 `.github/`，
# 需要显式排除这个文件；否则每导一次就把冲突装回去。
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: law-bench

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: law_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Public-repo leak gate (fail-closed)
        run: python3 scripts/check_public_hygiene.py

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # vendored path-source deps ([tool.uv.sources]): the name resolves on no
          # index, so install the wheel first — see pyproject.toml's note. Without
          # this line the whole release line is dead (No matching distribution).
          pip install vendor/fd_ontology_kernel-*.whl \
                    vendor/fd_open_data_protocol-*.whl
          pip install -e .
          # fd-coding-law-bench-mcp 的 server.py 在 tests/test_tool_annotations.py
          # 导入链上（MCP 工具注解对账），fastmcp 是其声明依赖。
          pip install "fastmcp>=4.2.4,<5"
          pip install pytest

      - name: Test suite (external excluded)
        env:
          database_url: postgresql://app:app@localhost:5432/law_bench
          # 让 MinIO 探活立刻失败而不是等网络超时：本 job 不跑 external 用例，
          # 但 import 期构造的默认端点不能指向真实地址。
          minio_host: http://127.0.0.1:1
        run: |
          echo "== 被排除的 external 用例 =="
          python -m pytest tests -q -m external --collect-only || true
          echo "== 正式跑 =="
          python -m pytest tests -q -m "not external"
      # 助手运行时的两条产品约束（角色工具面 + 提示词契约）。纯 Node、零依赖，
      # 所以跑在最便宜的位置；不进这一步的话它写在那里永远没人执行。
      - name: Assistant runtime contract (role face + prompt)
        run: node copilot-runtime/test/role-filter.test.mjs

  law-template:
    needs: test
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: law-template
      namespace: law-bench

  law-render:
    needs: test
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: law-render
      namespace: law-bench
      dockerfile: Dockerfile.render

  # The assistant runtime had NO build lane until 2026-11-24: every change to
  # copilot-runtime/server.mjs (role-scoped tool face, domain brief injection)
  # stayed on the branch while production kept running the old image, so the
  # web side and the runtime side disagreed. Node-only, no test job needed —
  # it earns its place by *existing*: an image nobody builds is a code change
  # that never ships.
  copilot-runtime:
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: copilot-runtime
      namespace: law-bench
      # context + dockerfile 都写全：共享 workflow 的 `file` 是相对 context 的，
      # 只传 context 而让 file 取默认值会让它去找仓根 Dockerfile（2026-11-24 实测
      # 报 `/src not found`，用的是 web 那份）。
      dockerfile: copilot-runtime/Dockerfile
      context: .
