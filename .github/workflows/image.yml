# Container image publish — GitHub Actions → Tencent TCR personal edition.
# Standard channel per openspec tcr-image-pipeline (2026-09-30 user directive):
# push to hkccr (HK, fast transpacific leg) → cheap-3 tcr-relay backfills
# ccr.ccs.tencentyun.com (≤5 min cycle, skopeo byte-identical) → nodes pull
# from ccr (registries.yaml auth, no imagePullSecret needed).
# Jenkins→Harbor remains the fallback channel for this repo.
#
# Matrix on push: law-template (web app + bundled MCP) + law-render
# (extract-render-service: shared DOCX->PDF render pod).
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: law-bench

jobs:
  build-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: law-template
            dockerfile: Dockerfile
          - image: law-render
            dockerfile: Dockerfile.render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
