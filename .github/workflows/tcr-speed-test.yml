name: tcr-speed-test

# Temporary diagnostic (switch-image-pipeline-github-actions-tcr): measures
# blob-upload throughput from a GitHub-hosted runner to TCR personal edition
# vs GHCR, to confirm/deny the US->TCR crawl hypothesis. Delete after use.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  speed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Make a 50 MiB image
        run: |
          set -euo pipefail
          mkdir -p /tmp/st && cd /tmp/st
          head -c 52428800 /dev/urandom > blob.bin
          printf 'FROM scratch\nADD blob.bin /blob.bin\n' > Dockerfile
          docker build -q -t speedtest:local . >/dev/null
          docker image inspect speedtest:local --format 'built {{.Size}} bytes'

      - name: Push to TCR (timed)
        run: |
          set -euo pipefail
          echo "$TCR_PASS" | docker login ccr.ccs.tencentyun.com -u "$TCR_USER" --password-stdin 2>/dev/null
          docker tag speedtest:local ccr.ccs.tencentyun.com/law-bench/speedtest:t
          start=$(date +%s)
          timeout 480 docker push ccr.ccs.tencentyun.com/law-bench/speedtest:t || echo "TCR push: FAILED/TIMEOUT after 480s"
          end=$(date +%s)
          echo "TCR push took $((end-start))s for ~50 MiB"
        env:
          TCR_USER: ${{ secrets.TCR_USER }}
          TCR_PASS: ${{ secrets.TCR_PASS }}

      - name: Push to GHCR (timed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag speedtest:local "ghcr.io/${{ github.repository_owner }}/law-bench-speedtest:t"
          start=$(date +%s)
          docker push "ghcr.io/${{ github.repository_owner }}/law-bench-speedtest:t"
          end=$(date +%s)
          echo "GHCR push took $((end-start))s for ~50 MiB"
