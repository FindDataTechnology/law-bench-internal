name: list-tcr-tags

# Temporary diagnostic (extract-render-service): answer "which tags actually
# exist in TCR right now" — the 14:09 build-and-push run lost its runner
# mid-push and we need to know whether law-template/law-render sha-aa3df58
# landed. Delete after use.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query TCR registry API with docker-issued creds
        env:
          TCR_USER: ${{ secrets.TCR_USER }}
          TCR_PASS: ${{ secrets.TCR_PASS }}
        run: |
          set -euo pipefail
          echo "$TCR_PASS" | docker login ccr.ccs.tencentyun.com -u "$TCR_USER" --password-stdin
          AUTH=$(python3 -c "
          import json, os
          cfg = json.load(open(os.path.expanduser('~/.docker/config.json')))
          print(cfg['auths']['ccr.ccs.tencentyun.com']['auth'])
          ")
          H="Authorization: Basic $AUTH"
          A="Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json"
          for repo in law-template law-render; do
            echo "== tags for law-bench/$repo =="
            curl -sS -H "$H" "https://ccr.ccs.tencentyun.com/v2/law-bench/$repo/tags/list" || echo "(tags/list failed)"
            echo
          done
          for ref in law-template:sha-aa3df58 law-render:sha-aa3df58 law-template:sha-98bbbb8 law-template:latest; do
            repo=${ref%%:*}; tag=${ref##*:}
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H "$H" -H "$A" \
              "https://ccr.ccs.tencentyun.com/v2/law-bench/$repo/manifests/$tag")
            echo "manifest $ref -> HTTP $code"
          done
