name: list-tcr-tags

# Temporary diagnostic (extract-render-service): answer "which tags actually
# exist in TCR right now" — the 14:09 build-and-push run lost its runner
# mid-push and we need to know whether law-template/law-render sha-aa3df58
# landed. Delete after use.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login and inspect TCR manifests
        env:
          TCR_USER: ${{ secrets.TCR_USER }}
          TCR_PASS: ${{ secrets.TCR_PASS }}
        run: |
          set -euo pipefail
          echo "$TCR_PASS" | docker login ccr.ccs.tencentyun.com -u "$TCR_USER" --password-stdin 2>/dev/null
          for ref in \
            law-bench/law-template:sha-aa3df58 \
            law-bench/law-render:sha-aa3df58 \
            law-bench/law-template:sha-98bbbb8 \
            law-bench/law-template:latest; do
            if docker manifest inspect "ccr.ccs.tencentyun.com/$ref" >/dev/null 2>&1; then
              size=$(docker manifest inspect "ccr.ccs.tencentyun.com/$ref" | python3 -c "import json,sys; m=json.load(sys.stdin); print('multi-arch')" 2>/dev/null || true)
              echo "EXISTS: $ref"
            else
              echo "MISSING: $ref"
            fi
          done
