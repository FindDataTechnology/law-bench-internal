# ArgoCD Application for the law-bench namespace.
#
# Apply with:
#   kubectl apply -f argocd/appproject.yaml -n argocd    # project first
#   kubectl apply -f argocd/application.yaml -n argocd
#
# Before this, the namespace was applied by hand (`kubectl apply -f
# deploy/*.yaml` from cheap-4) — the 2026-09-21 rolls are the last ones done
# that way. The app is what makes a deploy declarative: bump the image tag in
# `deploy/deployment.yaml`, commit, push, and ArgoCD rolls the pod.
#
# Scope: `path: deploy`, top-level `*.yaml` only (the subdirectories hold other
# boxes' manifests and runbooks — america-box is retired, china-box/public/
# review-agent belong elsewhere), minus the exclusions noted below.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: law-bench
  namespace: argocd
  annotations:
    # Kept out of the sync on purpose: the file is stale relative to the live
    # object (manifest says image sha-2c502d7 + nodeSelector cheap-4; live runs
    # sha-5f8041a on liuliangdmh1xr0w9ryu) and neither tag exists in Harbor, so
    # syncing it would move the MCP pod and risk ImagePullBackOff. Reconcile the
    # file with the intended state, then drop this exclusion.
    law-bench.excluded: mcp-deployment.yaml
spec:
  project: law-bench
  source:
    repoURL: https://gitee.com/FindDataTechnology/law-bench.git
    targetRevision: main
    path: deploy
    directory:
      include: '*.yaml'
      exclude: 'mcp-deployment.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: law-bench
  syncPolicy:
    # selfHeal reverts manual kubectl edits (git is the source of truth). No
    # prune: nothing is ever deleted by a sync, so a manifest dropped from the
    # repo leaves the live object alone.
    automated:
      selfHeal: true
