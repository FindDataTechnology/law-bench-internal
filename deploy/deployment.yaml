apiVersion: apps/v1
kind: Deployment
metadata:
  name: law-bench
  namespace: law-bench
  labels:
    app: law-bench
spec:
  replicas: 1
  selector:
    matchLabels:
      app: law-bench
  template:
    metadata:
      labels:
        app: law-bench
    spec:
      imagePullSecrets:
        - name: harbor-pull
      # Node resolv.conf picked up a wildcard `mesh.finddata.cn` search domain
      # (returns 8.218.137.223 for everything). ClusterFirst inherits it, so new
      # pods resolve postgres.postgres.svc.cluster.local -> 8.218.137.223 (black
      # hole) and psycopg.connect() hangs at startup -> CrashLoopBackOff. Pin DNS
      # to kube-dns + the clean 3-domain search (matches the working pre-pollution
      # pod), and pin the public Logto/Lawbench domains via hostAliases so the
      # fail-closed auth path never depends on upstream DNS.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.43.0.10
        searches:
          - law-bench.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "5"
      hostAliases:
        - ip: 23.144.68.246
          hostnames:
            - logto.tokenvault.vip
            - lawbench.tokenvault.vip
      initContainers:
        - name: seed-db
          image: harbor.local/law-bench/law-template:sha-3e8bd53
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: /data
              name: db
          command:
            - sh
            - -c
            - |
              set -e
              if [ -f /data/evaluation_rules.db ]; then
                echo "evaluation_rules.db already present in PVC, skipping seed."
              else
                echo "seeding evaluation_rules.db from image into PVC..."
                cp /app/db/evaluation_rules.db /data/evaluation_rules.db
              fi
              chown -R 1001:1001 /data
              ls -la /data
      containers:
        - name: law-bench
          image: harbor.local/law-bench/law-template:sha-3e8bd53
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: law-bench-db
            - secretRef:
                name: law-bench-minio
            - secretRef:
                name: law-bench-judge
            - secretRef:
                name: law-bench-auth
          ports:
            - containerPort: 8010
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8010
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8010
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - mountPath: /app/db
              name: db
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: law-bench-db
